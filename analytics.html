<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Dashboard – Watch Deals</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --gold: #d4af37; --dark-bg: #0a0a0a; --card-bg: #1a1a1a; --border: #2a2a2a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--dark-bg); color: #fff; line-height: 1.6; }
    a { color: var(--gold); text-decoration: none; }

    header { background: linear-gradient(135deg, #1a1a1a, #2d2d2d); padding: 18px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #333; flex-wrap: wrap; gap: 10px; }
    .logo { font-size: 22px; font-weight: bold; color: var(--gold); letter-spacing: 2px; }
    nav { display: flex; flex-wrap: wrap; gap: 5px; }
    nav a { color: #ccc; margin-left: 20px; font-size: 15px; }
    nav a:hover { color: var(--gold); }

    .analytics-container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
    .analytics-container h1 { color: var(--gold); text-align: center; margin-bottom: 40px; font-size: 32px; }
    .analytics-container h2 { color: var(--gold); margin-bottom: 20px; font-size: 22px; }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 25px; text-align: center; transition: transform 0.3s, border-color 0.3s; }
    .stat-card:hover { transform: translateY(-3px); border-color: var(--gold); }
    .stat-card h3 { color: #aaa; font-size: 13px; font-weight: 500; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
    .stat-card p { font-size: 36px; color: var(--gold); font-weight: bold; }

    .chart-section, .top-products, .recent-clicks { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 30px; margin-bottom: 30px; overflow-x: auto; }
    .chart-section canvas { max-height: 350px; }
    table { width: 100%; border-collapse: collapse; min-width: 500px; }
    th { background: var(--dark-bg); color: var(--gold); padding: 12px; text-align: left; font-size: 14px; border-bottom: 2px solid var(--border); }
    td { padding: 12px; border-bottom: 1px solid var(--border); color: #ccc; font-size: 14px; }

    .btn-danger { background: #dc3545; color: #fff; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; display: block; margin-left: auto; margin-right: auto; }
    .btn-danger:hover { background: #c82333; }

    .empty-msg { text-align: center; color: #777; padding: 30px; }

    footer { text-align: center; padding: 40px 20px; background: #111; color: #666; border-top: 1px solid #222; margin-top: 40px; }
    footer a { color: var(--gold); margin: 0 5px; }

    @media (max-width: 600px) {
      header { flex-direction: column; padding: 15px; gap: 12px; }
      nav { justify-content: center; width: 100%; }
      nav a { margin: 0 8px; font-size: 13px; }
      .analytics-container h1 { font-size: 24px; }
      .stat-card p { font-size: 28px; }
      .chart-section, .top-products, .recent-clicks { padding: 20px 15px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">⌚ WATCH DEALS – Analytics</div>
  <nav>
    <a href="index.html">View Site</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<main class="analytics-container">
  <h1>Click Tracking Dashboard</h1>

  <div class="stats-grid">
    <div class="stat-card"><h3>Total Clicks</h3><p id="totalClicks">0</p></div>
    <div class="stat-card"><h3>Today</h3><p id="todayClicks">0</p></div>
    <div class="stat-card"><h3>This Week</h3><p id="weekClicks">0</p></div>
    <div class="stat-card"><h3>Unique Products</h3><p id="uniqueProducts">0</p></div>
  </div>

  <section class="chart-section">
    <h2>Clicks – Last 14 Days</h2>
    <canvas id="clicksChart"></canvas>
  </section>

  <section class="top-products">
    <h2>🏆 Top 10 Most Clicked Products</h2>
    <table>
      <thead><tr><th>Product</th><th>Brand</th><th>Clicks</th></tr></thead>
      <tbody id="topProductsBody"></tbody>
    </table>
  </section>

  <section class="recent-clicks">
    <h2>🕐 Recent Clicks</h2>
    <table>
      <thead><tr><th>Product</th><th>Brand</th><th>Date</th><th>Time</th></tr></thead>
      <tbody id="recentClicksBody"></tbody>
    </table>
  </section>

  <button id="clearData" class="btn-danger">🗑️ Clear All Analytics Data</button>
</main>

<footer>
  <p>© 2025 Watch Deals Analytics</p>
  <p style="margin-top:10px;">
    <a href="index.html">Home</a> | <a href="admin.html">Admin</a> | <a href="analytics.html">Analytics</a>
  </p>
</footer>

<script>
const clicks = JSON.parse(localStorage.getItem('watchClicks')) || [];

// Stats
document.getElementById('totalClicks').textContent = clicks.length;
const today = new Date().toISOString().split('T')[0];
document.getElementById('todayClicks').textContent = clicks.filter(c => c.date === today).length;
const weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().split('T')[0];
document.getElementById('weekClicks').textContent = clicks.filter(c => c.date >= weekAgo).length;
document.getElementById('uniqueProducts').textContent = new Set(clicks.map(c => c.productId)).size;

// Chart
const last14Days = [];
for (let i = 13; i >= 0; i--) {
  const d = new Date(Date.now() - i * 86400000).toISOString().split('T')[0];
  last14Days.push({ date: d, count: clicks.filter(c => c.date === d).length });
}

new Chart(document.getElementById('clicksChart'), {
  type: 'line',
  data: {
    labels: last14Days.map(d => d.date.slice(5)),
    datasets: [{
      label: 'Clicks',
      data: last14Days.map(d => d.count),
      borderColor: '#d4af37',
      backgroundColor: 'rgba(212, 175, 55, 0.1)',
      tension: 0.4,
      fill: true,
      pointBackgroundColor: '#d4af37',
      pointBorderColor: '#fff',
      pointRadius: 4
    }]
  },
  options: {
    responsive: true,
    plugins: { legend: { display: false } },
    scales: {
      y: { beginAtZero: true, ticks: { color: '#aaa' }, grid: { color: '#222' } },
      x: { ticks: { color: '#aaa' }, grid: { color: '#222' } }
    }
  }
});

// Top products
const productCounts = {};
clicks.forEach(c => {
  const key = `${c.productName}|${c.brand}`;
  productCounts[key] = (productCounts[key] || 0) + 1;
});
const topProducts = Object.entries(productCounts).sort((a, b) => b[1] - a[1]).slice(0, 10);

if (topProducts.length === 0) {
  document.getElementById('topProductsBody').innerHTML = '<tr><td colspan="3" class="empty-msg">No clicks yet. Data will appear here once visitors click Buy Now.</td></tr>';
} else {
  document.getElementById('topProductsBody').innerHTML = topProducts.map(([key, count]) => {
    const [name, brand] = key.split('|');
    return `<tr><td>${name}</td><td>${brand}</td><td>${count}</td></tr>`;
  }).join('');
}

// Recent clicks
const recent = clicks.slice(-20).reverse();
if (recent.length === 0) {
  document.getElementById('recentClicksBody').innerHTML = '<tr><td colspan="4" class="empty-msg">No recent clicks yet.</td></tr>';
} else {
  document.getElementById('recentClicksBody').innerHTML = recent.map(c => `
    <tr>
      <td>${c.productName.substring(0, 40)}</td>
      <td>${c.brand}</td>
      <td>${c.date}</td>
      <td>${new Date(c.timestamp).toLocaleTimeString()}</td>
    </tr>
  `).join('');
}

// Clear data
document.getElementById('clearData').onclick = () => {
  if (confirm('⚠️ Are you sure you want to clear all analytics data? This cannot be undone.')) {
    localStorage.removeItem('watchClicks');
    location.reload();
  }
};
</script>

</body>
</html>
